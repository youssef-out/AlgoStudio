<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoStudio - Éditeur & Simulateur Algorithmique</title>
    <link rel="stylesheet" href="css/vscode.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232563eb%22/><text x=%2216%22 y=%2222%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2218%22 text-anchor=%22middle%22>A</text></svg>">

    <!-- SYNCHRONOUS ROUTE PRE-LOADER (Zero-flash on page refresh) -->
    <script>
        (function() {
            try {
                const tabs = JSON.parse(localStorage.getItem('algo_open_tabs') || '[]');
                const hash = window.location.hash;
                const isHome = hash === '#/home' || hash === '#home';
                if (tabs.length > 0 && !isHome) {
                    document.documentElement.classList.add('route-editor');
                } else {
                    document.documentElement.classList.add('route-home');
                }
            } catch(e) {}
        })();
    </script>
</head>
<body>

    <!-- TOP HEADER -->
    <header class="app-header">
        <div class="brand" id="brand-home-btn" title="Aller à la page d'accueil">
            <div class="brand-logo">
                <svg viewBox="0 0 32 32" width="24" height="24" fill="none">
                    <rect width="32" height="32" rx="8" fill="url(#logo-grad)"/>
                    <path d="M10 22L16 9L22 22" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12.5 17.5H19.5" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#3b82f6"/>
                            <stop offset="1" stop-color="#1d4ed8"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">AlgoStudio</span>
            </div>
        </div>

        <div class="header-actions">
            <input type="file" id="file-upload-input" accept=".algo" style="display: none;">
            
            <button class="btn btn-secondary" id="btn-header-new" title="Créer un nouvel onglet">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                <span>Nouveau</span>
            </button>

            <button class="btn btn-secondary" id="btn-upload" title="Ouvrir un fichier .algo">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <span>Ouvrir</span>
            </button>
            
            <button class="btn btn-secondary" id="btn-save" title="Enregistrer le fichier .algo actif" style="display: none;">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                </svg>
                <span>Enregistrer</span>
            </button>

            <button class="btn btn-run" id="btn-run" title="Lancer l'algorithme (F5)" style="display: none;">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
                <span>Tester</span>
            </button>

            <button class="btn btn-stop" id="btn-stop" title="Arrêter l'exécution" style="display: none;">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="5" y="5" width="14" height="14" rx="2"/>
                </svg>
                <span>Arrêter</span>
            </button>
        </div>
    </header>

    <!-- TABS BAR -->
    <nav class="tabs-nav">
        <div class="tabs-list" id="tabs-list">
            <!-- Dynamic Tabs inserted here -->
        </div>
        <button class="tab-btn-add" id="btn-add-tab" title="Nouveau fichier">+</button>

        <div class="tabs-nav-right">
            <!-- EXAMPLES SELECTOR -->
            <div class="select-box">
                <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <select id="example-select" aria-label="Exemples d'algorithme">
                    <option value="" disabled selected>Exemples d'algorithme...</option>
                    <option value="surface_cercle">Surface d'un Cercle</option>
                    <option value="surface_rectangle">Surface d'un Rectangle</option>
                    <option value="presentation">Dialogue Nom & Âge</option>
                    <option value="age_futur">Expression Âge + 5 ans</option>
                    <option value="condition_majeur">Condition SI / SINON</option>
                    <option value="selon_cas">Structure SELON / CAS</option>
                    <option value="boucle_pour">Boucle POUR</option>
                    <option value="boucle_repeter">Boucle RÉPÉTER</option>
                    <option value="boucle_tantque">Boucle TANT QUE</option>
                    <option value="decimal_binaire">Conversion Binaire</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </div>
            <span class="cursor-info" id="editor-status-info" style="display: none;">Ln 1, Col 1</span>
        </div>
    </nav>

    <!-- MAIN WORKSPACE -->
    <main class="main-workspace">
        
        <!-- WELCOME / HOME SCREEN (QUAND AUCUN ONGLET N'EST OUVERT OU AU DEMARRAGE) -->
        <div class="welcome-screen" id="welcome-screen">
            <div class="welcome-hero">
                <div class="welcome-logo-badge">
                    <svg viewBox="0 0 32 32" width="48" height="48" fill="none">
                        <rect width="32" height="32" rx="8" fill="url(#hero-logo-grad)"/>
                        <path d="M10 22L16 9L22 22" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12.5 17.5H19.5" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="hero-logo-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#3b82f6"/>
                                <stop offset="1" stop-color="#1d4ed8"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="welcome-title">Bienvenue sur AlgoStudio</h1>
                <p class="welcome-subtitle">Écrivez, testez et simulez vos algorithmes en toute simplicité</p>

                <!-- BIG CENTRAL BUTTONS -->
                <div class="welcome-big-actions">
                    <button class="big-action-btn btn-primary-action" id="btn-welcome-new">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        <div class="btn-text-group">
                            <span class="btn-main-text">Nouveau Fichier</span>
                            <span class="btn-sub-text">Créer un algorithme vide</span>
                        </div>
                    </button>

                    <button class="big-action-btn btn-secondary-action" id="btn-welcome-open">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                        <div class="btn-text-group">
                            <span class="btn-main-text">Ouvrir un Fichier</span>
                            <span class="btn-sub-text">Charger depuis votre PC (.algo)</span>
                        </div>
                    </button>
                </div>
            </div>

            <!-- RECENT FILES SECTION (LOCALSTORAGE) -->
            <div class="recent-files-container">
                <div class="recent-header">
                    <div class="recent-title">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <span>Fichiers récents</span>
                    </div>
                    <button class="btn-clear-recent" id="btn-clear-recent">Effacer l'historique</button>
                </div>

                <div class="recent-list" id="recent-list">
                    <!-- Dynamic recent files will be rendered here -->
                </div>
            </div>
        </div>

        <!-- EDITOR VIEW -->
        <div class="editor-view" id="editor-view" style="display: none;">
            <div class="editor-container" id="editor-container"></div>
        </div>

        <!-- CONSOLE / RESULT SECTION (VISIBLE UNIQUEMENT QUAND UN ONGLET EST OUVERT) -->
        <section class="console-section" id="console-section" style="display: none;">
            <div class="console-header">
                <div class="console-header-left">
                    <div class="console-tab">
                        <svg class="terminal-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="4 17 10 11 4 5"/>
                            <line x1="12" y1="19" x2="20" y2="19"/>
                        </svg>
                        <span class="tab-text">Console & Résultat</span>
                    </div>
                    <div class="status-indicator">
                        <span class="status-dot dot-ready" id="status-dot"></span>
                        <span class="status-text" id="run-status-text">Prêt</span>
                    </div>
                </div>

                <div class="console-header-right">
                    <span class="exec-time-badge" id="exec-time-badge" style="display: none;">0.00s</span>
                    <button class="btn-clear-terminal" id="btn-clear-console" title="Effacer la console">
                        <svg class="clear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        <span>Effacer</span>
                    </button>
                </div>
            </div>

            <div class="console-viewport" id="console-body">
                <div class="terminal-output" id="console-logs">
                    <div class="terminal-welcome">
                        <span class="welcome-badge">Console active</span>
                        <span class="welcome-text">Prêt pour l'exécution. Les sorties et saisies s'afficheront ici.</span>
                    </div>
                </div>

                <!-- INTERACTIVE INPUT STREAM -->
                <div class="terminal-input-prompt-bar" id="console-input-row" style="display: none;">
                    <div class="prompt-prefix">
                        <span class="prompt-arrow">➜</span>
                        <span class="prompt-label" id="console-prompt">LIRE(x) :</span>
                    </div>
                    <input type="text" class="terminal-input-box" id="console-input" placeholder="Tapez la valeur puis appuyez sur Entrée..." autocomplete="off">
                    <button class="btn-prompt-send" id="console-btn-submit" title="Valider la saisie (Entrée)">
                        <span>Valider</span>
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 10 4 15 9 20"/>
                            <path d="M20 4v7a4 4 0 0 1-4 4H4"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Monaco Loader CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <!-- Scripts -->
    <script src="js/interpreter.js"></script>
    <script src="js/translator.js"></script>
    <script src="js/examples.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
